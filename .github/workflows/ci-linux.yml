name: CI Linux

on:
  pull_request:
    branches: [main]
    paths:
      - "src/linux/**"
      - "include/**"
      - "bindings/**"
      - "fit_webview_bridge/**"
      - "scripts/linux/**"
      - "examples/linux/**"
      - "tests/**"
      - "docs/build-linux.md"
      - "CMakeLists.txt"
      - "pyproject.toml"
      - ".clang-format"
      - ".github/workflows/ci-linux.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-x86-64:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      QT_VERSION: "6.9.0"
      PYSIDE_VERSION: "6.9.0"
      WHEELHOUSE: ${{ github.workspace }}/wheelhouse

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Confirm runner
        run: |
          set -euo pipefail
          uname -m
          cat /etc/os-release
          test "$(uname -m)" = "x86_64"
          echo "QT_ROOT=${RUNNER_TEMP}/Qt" >> "${GITHUB_ENV}"

      - name: Install Ubuntu build and X11 runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential ca-certificates clang-format curl git \
            libegl1 libgl1 libgl1-mesa-dri libgtk-3-dev libwebkit2gtk-4.1-dev \
            libx11-xcb1 libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 \
            libxcb-util1 libxcb-xkb1 libxkbcommon-x11-0 libxml2 \
            ninja-build pkg-config ripgrep xauth xvfb

      - name: Setup Python 3.11
        id: py311
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Setup Python 3.12
        id: py312
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Setup Python 3.13
        id: py313
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install Python build tools and bindings
        env:
          PY311: ${{ steps.py311.outputs.python-path }}
          PY312: ${{ steps.py312.outputs.python-path }}
          PY313: ${{ steps.py313.outputs.python-path }}
        run: |
          set -euo pipefail
          for python_exe in "${PY311}" "${PY312}" "${PY313}"; do
            "${python_exe}" -m pip install --upgrade pip
            "${python_exe}" -m pip install \
              "PySide6==${PYSIDE_VERSION}" \
              "shiboken6==${PYSIDE_VERSION}" \
              "shiboken6-generator==${PYSIDE_VERSION}" \
              "scikit-build-core>=0.9" \
              auditwheel build cmake ninja
          done
          "${PY311}" -m pip install aqtinstall

      - name: Install Qt SDK
        env:
          PY311: ${{ steps.py311.outputs.python-path }}
        run: |
          "${PY311}" -m aqt install-qt linux desktop "${QT_VERSION}" linux_gcc_64 --outputdir "${QT_ROOT}"
          qt6_dir="${QT_ROOT}/${QT_VERSION}/gcc_64/lib/cmake/Qt6"
          test -f "${qt6_dir}/Qt6Config.cmake"
          echo "Qt6_DIR=${qt6_dir}" >> "${GITHUB_ENV}"

      - name: Build and validate Python 3.11 wheel
        env:
          PYTHON_EXE: ${{ steps.py311.outputs.python-path }}
          PYTHON_VERSION: "3.11"
          PY_TAG: "311"
        run: ./scripts/linux/ci_build_wheel.sh

      - name: Build and validate Python 3.12 wheel
        env:
          PYTHON_EXE: ${{ steps.py312.outputs.python-path }}
          PYTHON_VERSION: "3.12"
          PY_TAG: "312"
        run: ./scripts/linux/ci_build_wheel.sh

      - name: Build and validate Python 3.13 wheel
        env:
          PYTHON_EXE: ${{ steps.py313.outputs.python-path }}
          PYTHON_VERSION: "3.13"
          PY_TAG: "313"
        run: ./scripts/linux/ci_build_wheel.sh

      - name: Run static and quality checks
        run: |
          set -euo pipefail
          git diff --check
          python -m compileall -q fit_webview_bridge examples/linux tests
          mapfile -t format_files < <(find src/linux -type f \( -name '*.cpp' -o -name '*.h' \) -print | sort)
          test "${#format_files[@]}" -gt 0
          clang-format --dry-run --Werror "${format_files[@]}"
          home_pattern='/ho''me/'
          if rg -n "${home_pattern}" --glob '!build*/**' --glob '!dist/**' --glob '!Qt/**' --glob '!.venv*/**' .; then
            echo "Hardcoded /home path found" >&2
            exit 1
          fi
          if rg -n '/usr/lib/(aarch64|x86_64)|/lib/(aarch64|x86_64)' \
            --glob '!build*/**' --glob '!dist/**' --glob '!Qt/**' --glob '!.venv*/**' .; then
            echo "Hardcoded architecture-specific system library path found" >&2
            exit 1
          fi
          git diff --exit-code -- src/macos bindings/pyside6/macos \
            include/fit_webview_bridge/SystemWebViewWidget.h \
            bindings/pyside6/typesystem_systemwebview.xml .github/workflows/ci-macos.yml
          test "$(find "${WHEELHOUSE}" -maxdepth 1 -type f -name '*.whl' | wc -l)" -eq 3

      - name: Upload Linux wheel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64-wheels
          path: wheelhouse/*.whl
          if-no-files-found: error
